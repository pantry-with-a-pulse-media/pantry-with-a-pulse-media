<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantry With a Pulse TikTok Authorization</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #fff7e8;
      color: #2d2418;
    }
    main {
      width: min(720px, calc(100vw - 32px));
      background: #ffffff;
      border: 1px solid #eadfc8;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 16px 50px rgba(45, 36, 24, 0.12);
    }
    h1 { margin-top: 0; color: #174d2c; }
    textarea {
      width: 100%;
      min-height: 140px;
      box-sizing: border-box;
      border: 1px solid #d7cbb4;
      border-radius: 12px;
      padding: 12px;
      font: 14px ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    button {
      margin-top: 16px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      color: white;
      background: #174d2c;
      font-weight: 700;
      cursor: pointer;
    }
    .note { color: #6d5d46; }
  </style>
</head>
<body>
  <main>
    <h1>Pantry With a Pulse</h1>
    <p>TikTok authorization received. Copy this page URL and return to Codex so the server can finish OAuth.</p>
    <textarea id="url" readonly></textarea>
    <button id="copy" type="button">Copy authorization URL</button>
    <p class="note">This page stores nothing. It only shows the current browser URL.</p>
  </main>
  <script>
    const field = document.getElementById('url');
    field.value = window.location.href;
    document.getElementById('copy').addEventListener('click', async () => {
      await navigator.clipboard.writeText(window.location.href);
      document.getElementById('copy').textContent = 'Copied';
    });
  </script>
</body>
</html>
